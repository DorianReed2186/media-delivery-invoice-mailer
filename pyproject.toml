[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-delivery-invoice-mailer"
version = "0.1.0"
description = "Issue a media delivery invoice PDF and send a customer notice with Infrai."
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
py-modules = ["invoice_dispatcher", "send_creator_invoice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
